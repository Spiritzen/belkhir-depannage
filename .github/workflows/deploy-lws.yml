name: Deploy to LWS (FTPS)

# Remplace l'ancien déploiement GitHub Pages (workflow supprimé).
#  - pull_request vers main : contrôles + build, AUCUNE connexion FTPS ;
#  - push sur main          : contrôles + build toujours ; déploiement FTPS vers /htdocs/
#    UNIQUEMENT si la variable GitHub LWS_DEPLOY_ENABLED vaut « true » (sinon ignoré
#    proprement après des contrôles verts) ;
#  - workflow_dispatch      : choix explicite `mode` : « dry-run » (connexion FTPS, miroir
#    --dry-run : aucun transfert ni suppression ; toute branche) ou « deploy » (miroir
#    réel ; main uniquement).
#
# Le mot de passe SMTP du formulaire n'est PAS géré ici : il vit uniquement dans un
# fichier privé hors htdocs sur LWS (voir php/README.md et DEPLOIEMENT_LWS.md).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run : miroir FTPS simulé (aucun transfert ni suppression) — deploy : miroir réel (main uniquement)'
        type: choice
        options:
          - dry-run
          - deploy
        default: dry-run

permissions:
  contents: read

# Une seule exécution par branche à la fois. Les contrôles de pull request sont annulés
# par une exécution plus récente ; sur main, on met en file d'attente plutôt que
# d'interrompre un miroir FTPS en cours (un site à moitié publié serait pire).
concurrency:
  group: deploy-lws-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.3'

jobs:
  verify:
    name: Contrôles et build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js (version du dépôt)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup PHP et Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, openssl
          tools: composer:v2
          coverage: none

      - name: Composer validate
        run: composer validate --strict

      - name: Composer install (production, reproductible)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Composer audit
        run: composer audit --locked

      - name: Lint PHP
        run: find php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Tests PHP (faux transport, aucun envoi réel)
        run: php php/tests/run.php

      - name: Installer les dépendances JS
        run: npm ci

      - name: Vérification Astro
        run: npm run check

      # Le build précède la suite JS : plusieurs tests lisent dist/.
      - name: Build (Astro + endpoint PHP)
        run: npm run build

      - name: Tests JS (suite complète)
        run: npm run test:run

      - name: Contrôle de l'artefact dist/ (secrets, fichiers requis, noindex)
        run: node scripts/check-dist.mjs dist

      - name: Déploiement LWS désactivé (variable LWS_DEPLOY_ENABLED absente ou ≠ true)
        if: github.event_name == 'push' && vars.LWS_DEPLOY_ENABLED != 'true'
        run: |
          echo "::notice::Contrôles et build verts. Déploiement LWS ignoré (la variable GitHub LWS_DEPLOY_ENABLED n'est pas « true »)."

      - name: Fichiers cachés présents dans dist/
        run: |
          test -f dist/.htaccess
          test -f dist/api/_lib/.htaccess
          ls -la dist | head -30

      - name: Publier l'artefact de déploiement (fichiers cachés inclus)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lws-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Déploiement FTPS vers /htdocs/
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.LWS_DEPLOY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'dry-run' ||
      (inputs.mode == 'deploy' && github.ref == 'refs/heads/main'))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      LWS_FTP_HOST: ${{ secrets.LWS_FTP_HOST }}
      LWS_FTP_USERNAME: ${{ secrets.LWS_FTP_USERNAME }}
      LWS_FTP_PASSWORD: ${{ secrets.LWS_FTP_PASSWORD }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
    steps:
      - name: Checkout (scripts de contrôle)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Télécharger l'artefact vérifié
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lws-dist
          path: dist

      - name: Revérifier l'artefact (dotfiles préservés)
        run: |
          test -f dist/.htaccess
          test -f dist/api/_lib/.htaccess
          node scripts/check-dist.mjs dist

      - name: Secrets requis présents (valeurs jamais affichées)
        run: |
          missing=0
          for v in LWS_FTP_HOST LWS_FTP_USERNAME LWS_FTP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret GitHub manquant : $v"; missing=1; fi
          done
          [ "$missing" -eq 0 ]
          case "$LWS_FTP_HOST" in
            *[!A-Za-z0-9.-]*|"") echo "::error::LWS_FTP_HOST doit être un nom d'hôte simple"; exit 1 ;;
          esac

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Exception limitée au serveur FTPS mutualisé LWS : son certificat est valide (chaîne
      # vérifiée par ssl:verify-certificate yes) mais son nom ne correspond pas à l'alias FTP
      # du domaine. Seule la comparaison nom d'hôte / certificat est désactivée
      # (ssl:check-hostname no) ; TLS et la vérification cryptographique restent obligatoires.
      - name: Miroir FTPS explicite vers /htdocs/ (TLS obligatoire, certificat vérifié)
        run: |
          set -euo pipefail
          umask 077
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
          script="$(mktemp)"
          trap 'rm -f "$script"' EXIT
          mirror_opts="--reverse --delete --no-perms --parallel=1 --verbose=1"
          if [ "$DRY_RUN" = "true" ]; then mirror_opts="$mirror_opts --dry-run"; echo "MODE SIMULATION : aucune écriture sur LWS."; fi
          echo "Source locale : dist/ ($(find dist -type f | wc -l) fichiers) — cible distante : /htdocs/"
          cat > "$script" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:timeout 30
          set ftp:passive-mode yes
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-auth TLS
          set ftp:ssl-protect-data yes
          set ftp:ssl-protect-list yes
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          open -u "$(esc "$LWS_FTP_USERNAME")","$(esc "$LWS_FTP_PASSWORD")" -p 21 "$LWS_FTP_HOST"
          cd /htdocs
          mirror $mirror_opts --exclude-glob .well-known --exclude-glob '.well-known/*' ./dist .
          bye
          LFTP
          lftp -f "$script"
